    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Galo Kids — Clothing & Toys for Little Explorers" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker for offline support + installability —
      // but ONLY in production. On localhost/dev it breaks Vite's module loading,
      // so there we actively unregister any previously installed worker.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var host = location.hostname;
        var isDev = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0';
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
          }
          return;
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      })();
    </script>
  </body>
</html>
